name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  APP_ROOT: /home/syyd9151/syyhoax-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_OUTPUT: standalone

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy/.next/static
          cp -r .next/standalone/. deploy/
          cp -r .next/static/. deploy/.next/static/
          cp -r public/. deploy/public/
          cp server.js deploy/server.js
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json

      - name: Upload via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.htaccess' --exclude='.well-known' --exclude='data/' --exclude='.env' --exclude='tmp/' --exclude='nodevenv/' --exclude='node_modules/'
          path: deploy/
          remote_path: ${{ env.APP_ROOT }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Install production deps and restart Passenger
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            source /home/syyd9151/nodevenv/syyhoax-app/22/bin/activate
            cd ${{ env.APP_ROOT }}
            npm ci --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
