name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  APP_ROOT: /home/syyd9151/syyhoax-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_OUTPUT: standalone

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy/.next/static
          cp -r .next/standalone/. deploy/
          # Rename Next's own server.js so our Passenger entry point doesn't clash
          mv deploy/server.js deploy/next-server.js
          cp -r .next/static/. deploy/.next/static/
          cp -r public/. deploy/public/
          # Passenger entry point
          cp server.js deploy/server.js
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json

      - name: Create tarball
        run: tar -czf deploy.tar.gz -C deploy .

      - name: Upload via scp
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/deploy.tar.gz

      - name: Extract, install deps and restart Passenger
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_ROOT }}
            tar -xzf ~/deploy.tar.gz --overwrite --exclude='.env' --exclude='data/*' --exclude='tmp/*'
            rm -f ~/deploy.tar.gz
            source /home/syyd9151/nodevenv/syyhoax-app/22/bin/activate
            npm install --omit=dev --no-audit --no-fund --maxsockets=1
            mkdir -p tmp
            touch tmp/restart.txt
