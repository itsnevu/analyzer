# docker compose up -d --build   (see DEPLOY.md, "Option: Docker")
services:
  app:
    build: .
    image: hoax-analyzer
    restart: unless-stopped
    env_file: .env.local
    # Reachable from this machine only; the HTTPS proxy (Cloudflare Tunnel or Caddy) is the public entrance.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Database, uploads, trained model and backups. Must be writable by uid 1000.
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
